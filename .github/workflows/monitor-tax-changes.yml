name: Tax Law Change Monitor

# Monthly: verify irs.gov responds, then scan recent IRS-tagged Federal Register
# documents for signals that might require updating TAX_DATA in App.jsx.
# No Anthropic API and no node-fetch — Node 20 native fetch only.

on:
  schedule:
    - cron: '0 8 1 * *' # 1st of every month, 08:00 UTC
  workflow_dispatch:

jobs:
  check-tax-law-changes:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Verify IRS source pages (HEAD)
        run: npm run verify:irs-sources

      - name: Scan Federal Register for IRS signals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/monitor-irs-signals.mjs
