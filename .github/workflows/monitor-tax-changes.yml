name: Tax Law Change Monitor

# Runs monthly to check for unexpected mid-year tax law changes
# (e.g. the One Big Beautiful Bill was signed July 4, 2025 — mid-year surprise)

on:
  schedule:
    # 1st of every month at 8:00 AM UTC
    - cron: '0 8 1 * *'
  workflow_dispatch:

jobs:
  check-tax-law-changes:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Check for tax law changes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          node - << 'EOF'
          const fetch = (...args) => import('node-fetch').then(({default: f}) => f(...args));

          async function check() {
            const res = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-api-key': process.env.ANTHROPIC_API_KEY,
                'anthropic-version': '2023-06-01',
              },
              body: JSON.stringify({
                model: 'claude-sonnet-4-20250514',
                max_tokens: 1000,
                tools: [{ type: 'web_search_20250305', name: 'web_search' }],
                messages: [{
                  role: 'user',
                  content: `Search for any significant US federal income tax law changes, IRS announcements, or new legislation passed in the last 60 days that would affect individual income tax calculations, deductions, credits, or filing requirements.

Return JSON only:
{
  "significant_changes_found": true/false,
  "changes": [{"title": "...", "summary": "...", "effective_date": "...", "source_url": "..."}],
  "recommendation": "no-action|update-data|review-required",
  "explanation": "one paragraph"
}`
                }]
              })
            });

            const data = await res.json();
            const text = data.content.filter(b => b.type === 'text').map(b => b.text).join('');
            const json = JSON.parse(text.match(/\{[\s\S]*\}/)[0]);

            console.log('Recommendation:', json.recommendation);

            if (json.recommendation !== 'no-action') {
              // Create a GitHub issue to flag the changes
              const issueBody = `## ⚠️ Tax Law Monitor Alert\n\n${json.explanation}\n\n### Changes Detected\n${json.changes.map(c => `- **${c.title}** (${c.effective_date}): ${c.summary}\n  Source: ${c.source_url}`).join('\n')}\n\n### Recommended Action\n\`${json.recommendation}\`\n\n---\n*Auto-generated by Tax Law Change Monitor workflow*`;

              await fetch(\`https://api.github.com/repos/${process.env.REPO}/issues\`, {
                method: 'POST',
                headers: {
                  'Authorization': \`Bearer ${process.env.GITHUB_TOKEN}\`,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  title: \`🚨 Tax Law Change Detected — Review Required (\${new Date().toISOString().slice(0,7)})\`,
                  body: issueBody,
                  labels: ['tax-law-change', 'needs-review']
                })
              });
              console.log('GitHub issue created');
            } else {
              console.log('No significant changes — no action needed');
            }
          }

          check().catch(err => { console.error(err); process.exit(1); });
          EOF
