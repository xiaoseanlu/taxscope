name: Annual Tax Data & Pricing Update

# ─── WHEN THIS RUNS ──────────────────────────────────────────────────────────
# 1. Automatically every October 15 (IRS usually releases next year's figures
#    in mid-October via their annual Revenue Procedure announcement)
# 2. Manually via GitHub UI: Actions → Annual Tax Update → Run workflow
# 3. Can also be triggered by pushing to a branch called "update-tax-data"

on:
  schedule:
    # Oct 15 at 9:00 AM UTC every year
    - cron: '0 9 15 10 *'
  workflow_dispatch:
    inputs:
      tax_year:
        description: 'Tax year to update for (e.g. 2027)'
        required: false
        default: 'auto'
      update_pricing:
        description: 'Also update product pricing?'
        type: boolean
        default: true

jobs:
  update-tax-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tax data update script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAX_YEAR_OVERRIDE: ${{ github.event.inputs.tax_year || 'auto' }}
          UPDATE_PRICING: ${{ github.event.inputs.update_pricing || 'true' }}
        run: node scripts/update-tax-data.js

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet src/App.jsx; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected in App.jsx"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected — will open PR"
          fi

      - name: Read update summary
        if: steps.check_changes.outputs.changed == 'true'
        id: summary
        run: |
          SUMMARY=$(cat /tmp/update-summary.md 2>/dev/null || echo "Tax data and pricing updated by automation.")
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: auto-update tax data and product pricing'
          title: '📊 Annual Tax Data Update — Review Before Merging'
          body: |
            ## ⚠️ Human Review Required Before Merging

            This PR was automatically generated by the annual tax data update workflow.

            **Always review these changes before merging:**
            - Verify bracket thresholds against IRS.gov directly
            - Check that contribution limits match official IRS announcements
            - Confirm product pricing against each vendor's current website
            - Look for any new legislation that might require additional UI changes

            ---

            ${{ steps.summary.outputs.summary }}

            ---

            **Sources to verify against:**
            - [IRS Tax Inflation Adjustments](https://www.irs.gov/newsroom/irs-releases-tax-inflation-adjustments)
            - [IRS 401k Limits](https://www.irs.gov/retirement-plans/plan-participant-employee/retirement-topics-401k-and-profit-sharing-plan-contribution-limits)
            - [TurboTax Pricing](https://turbotax.intuit.com)
            - [FreeTaxUSA Pricing](https://www.freetaxusa.com)
            - [H&R Block Pricing](https://www.hrblock.com)

            **Automated by:** `.github/workflows/update-tax-data.yml`
          branch: auto-update/tax-data-${{ github.run_id }}
          labels: |
            automated
            tax-data-update
            needs-review
